<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>作業觀察筆記</title>
  <meta name="description" content="寫作業期間非作業用途手機使用的 ABC 直接觀察紀錄（每次 20 分鐘）">
  <meta name="theme-color" content="#F3F1EA">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="行為觀察">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <div id="sheet-backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>

  <div id="modal-backdrop" class="backdrop backdrop--modal" hidden></div>
  <section id="modal" class="modal" role="alertdialog" aria-modal="true" hidden></section>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="update-bar" class="update-bar" hidden>
    <span>有新版本可用，重新整理即可更新</span>
    <button type="button" id="update-btn">重新整理</button>
  </div>

  <noscript>此工具需要開啟 JavaScript。</noscript>
  <script src="/app.js"></script>
</body>
</html>
